name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Recreate Android Project
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --android-language kotlin \
            --org com.avyra.app \
            .

      - name: Upgrade Kotlin Gradle Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings_files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts")
          ]

          settings = None

          for f in settings_files:
              if f.exists():
                  settings = f
                  break

          if settings is None:
              print("ERROR: Android settings file not found")
              exit(1)

          print("Using:", settings)

          text = settings.read_text()

          # Kotlin DSL: settings.gradle.kts
          text2 = re.sub(
              r'(id\(["\']org\.jetbrains\.kotlin\.android["\']\)\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.3.20\g<2>',
              text
          )

          # Groovy DSL: settings.gradle
          text2 = re.sub(
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
              r'\g<1>2.3.20\g<2>',
              text2
          )

          if text2 == text:
              print("ERROR: Kotlin plugin entry was not changed.")
              print("===== SETTINGS FILE =====")
              print(text)
              exit(1)

          settings.write_text(text2)

          print("SUCCESS: Kotlin Gradle Plugin set to 2.3.20")
          PY

      - name: Verify Kotlin Version
        run: |
          echo "===== KOTLIN VERSION ====="

          if [ -f android/settings.gradle.kts ]; then
            grep -n "org.jetbrains.kotlin.android" android/settings.gradle.kts
          fi

          if [ -f android/settings.gradle ]; then
            grep -n "org.jetbrains.kotlin.android" android/settings.gradle
          fi

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
