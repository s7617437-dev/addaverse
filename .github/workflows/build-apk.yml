name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Upgrade Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("android/settings.gradle")
          text = file.read_text()

          text = re.sub(
              r'(org\.jetbrains\.kotlin\.android["\']?\s*version\s*["\'])[^"\']+(["\'])',
              r'\g<1>2.3.20\g<2>',
              text
          )

          file.write_text(text)
          print("Kotlin version updated to 2.3.20")
          PY

          grep "org.jetbrains.kotlin.android" android/settings.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
