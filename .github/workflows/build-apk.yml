name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          rm -rf android
          flutter create --platforms=android --android-language kotlin .

      - name: Find and upgrade Kotlin
        run: |
          SETTINGS=$(find android -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          echo "Settings file found:"
          echo "$SETTINGS"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found"
            find android -maxdepth 3 -type f
            exit 1
          fi

          if [[ "$SETTINGS" == *.kts ]]; then
            sed -i 's/org.jetbrains.kotlin.android.*version.*$/id("org.jetbrains.kotlin.android") version("2.3.20") apply false/' "$SETTINGS"
          else
            sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.3.20"/' "$SETTINGS"
          fi

          echo "Kotlin configuration:"
          grep -R "org.jetbrains.kotlin.android" android || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
