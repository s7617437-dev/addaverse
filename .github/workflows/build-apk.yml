name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          rm -rf android
          flutter create --platforms=android --android-language kotlin .

      - name: Fix Kotlin JVM Target
        run: |
          APP_GRADLE="android/app/build.gradle.kts"

          echo "Fixing Kotlin JVM target..."

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: $APP_GRADLE not found"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          file = Path("android/app/build.gradle.kts")
          text = file.read_text()

          old = """kotlinOptions {
              jvmTarget = JavaVersion.VERSION_11.toString()
          }"""

          new = """compilerOptions {
              jvmTarget.set(
                  org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
              )
          }"""

          if old in text:
              text = text.replace(old, new)
              file.write_text(text)
              print("Kotlin JVM target fixed successfully.")
          else:
              print("Old kotlinOptions block not found.")
              print("Checking file for kotlinOptions...")

              if "kotlinOptions" in text:
                  import re

                  text = re.sub(
                      r'kotlinOptions\s*\{[^}]*jvmTarget\s*=\s*JavaVersion\.VERSION_11\.toString\(\)[^}]*\}',
                      new,
                      text,
                      flags=re.MULTILINE
                  )

                  file.write_text(text)
                  print("Kotlin JVM target fixed with fallback.")
              else:
                  print("No kotlinOptions block found. Nothing to replace.")
          PY

          echo "===== android/app/build.gradle.kts ====="
          cat android/app/build.gradle.kts
          echo "========================================"

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
