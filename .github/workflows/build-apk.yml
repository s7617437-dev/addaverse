name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --android-language kotlin \
            --org com.avyra.app \
            .

      - name: Fix Kotlin Version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "id 'org.jetbrains.kotlin.android' version '2.1.20'",
                  "id 'org.jetbrains.kotlin.android' version '2.1.20'"
              )
              p.write_text(s)

          p = Path("android/settings.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  'id("org.jetbrains.kotlin.android") version "2.1.20"',
                  'id("org.jetbrains.kotlin.android") version "2.1.20"'
              )
              p.write_text(s)
          PY

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
