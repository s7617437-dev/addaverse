name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          rm -rf android
          flutter create --platforms=android --android-language kotlin .

      - name: Upgrade Kotlin
        run: |
          SETTINGS=$(find android -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          echo "Settings file: $SETTINGS"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings file not found"
            exit 1
          fi

          sed -i '/org.jetbrains.kotlin.android/s/version "[^"]*"/version "2.3.20"/' "$SETTINGS"

          echo "Kotlin configuration:"
          grep "org.jetbrains.kotlin.android" "$SETTINGS"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
