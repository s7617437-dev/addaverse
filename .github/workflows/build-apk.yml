name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          flutter create --platforms=android .

      - name: Upgrade Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          android = Path("android")

          candidates = [
              android / "settings.gradle",
              android / "settings.gradle.kts"
          ]

          settings = next((p for p in candidates if p.exists()), None)

          if settings is None:
              print("Android settings file not found.")
              print("Files inside android:")
              for p in android.rglob("*"):
                  print(p)
              raise SystemExit(1)

          print("Using:", settings)

          text = settings.read_text()

          pattern = r'(org\.jetbrains\.kotlin\.android.*?version\s*["\'])([^"\']+)(["\'])'

          new_text, count = re.subn(
              pattern,
              r'\g<1>2.3.20\g<3>',
              text
          )

          if count == 0:
              print("Kotlin plugin line was not found.")
              print(text)
              raise SystemExit(1)

          settings.write_text(new_text)

          print("Kotlin upgraded to 2.3.20")
          PY

          echo "Kotlin configuration:"
          grep -R "org.jetbrains.kotlin.android" android/settings.gradle android/settings.gradle.kts 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
