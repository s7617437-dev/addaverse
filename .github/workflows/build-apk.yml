name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create fresh Android project
        run: |
          rm -rf android
          flutter create --platforms=android --android-language kotlin .

      - name: Upgrade Kotlin
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.3.20"/' android/settings.gradle

          echo "Kotlin version:"
          grep "org.jetbrains.kotlin.android" android/settings.gradle

      - name: Configure Java 17
        run: |
          sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' android/app/build.gradle
          sed -i 's/jvmTarget = JavaVersion.VERSION_17.toString()/jvmTarget = JavaVersion.VERSION_17.toString()/g' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses:
