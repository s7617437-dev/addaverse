name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Recreate Android Project
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --android-language kotlin \
            --org com.avyra.app \
            .

      - name: Upgrade Kotlin Gradle Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts")
          ]

          settings = next((p for p in candidates if p.exists()), None)

          if settings is None:
              print("ERROR: settings.gradle or settings.gradle.kts not found")
              exit(1)

          print("Using settings file:", settings)

          text = settings.read_text()

          pattern = (
              r'(id\s+["\']org\.jetbrains\.kotlin\.android'
              r'["\']\s+version\s+["\'])'
              r'[^"\']+'
              r'(["\'])'
          )

          match = re.search(pattern, text)

          if not match:
              print("ERROR: Kotlin Gradle Plugin entry not found")
              print(text)
              exit(1)

          print("Old Kotlin plugin:")
          print(match.group(0))

          text = re.sub(
              pattern,
              r'\g<1>2.3.20\g<2>',
              text
          )

          settings.write_text(text)

          print("Kotlin Gradle Plugin updated to 2.3.20")
          PY

      - name: Verify Kotlin Version
        run: |
          echo "===== Kotlin Gradle Plugin ====="

          if [ -f android/settings.gradle ]; then
            grep -n "org.jetbrains.kotlin.android" android/settings.gradle || true
          fi

          if [ -f android/settings.gradle.kts ]; then
            grep -n "org.jetbrains.kotlin.android" android/settings.gradle.kts || true
          fi

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
