name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Recreate Android Project
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --android-language kotlin \
            --org com.avyra.app \
            .

      - name: Check Android Project
        run: |
          echo "===== Android files ====="
          find android -maxdepth 2 -type f | sort

          echo "===== Settings file ====="

          if [ -f android/settings.gradle.kts ]; then
            echo "Found: android/settings.gradle.kts"
            cat android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            echo "Found: android/settings.gradle"
            cat android/settings.gradle
          else
            echo "ERROR: No settings.gradle or settings.gradle.kts found"
            exit 1
          fi

      - name: Upgrade Kotlin Gradle Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts")
          ]

          settings = next((p for p in files if p.exists()), None)

          if settings is None:
              print("ERROR: settings.gradle or settings.gradle.kts not found")
              exit(1)

          print("Using:", settings)

          s = settings.read_text()

          pattern = r'(org\.jetbrains\.kotlin\.android["\']?\s+version\s+["\'])[^"\']+(["\'])'

          if re.search(pattern, s):
              s = re.sub(
                  pattern,
                  r'\g<1>2.1.20\g<2>',
                  s
              )
              settings.write_text(s)
              print("Kotlin Gradle Plugin updated to 2.1.20")
          else:
              print("Kotlin plugin version pattern not found.")
              print("Keeping Flutter generated Kotlin configuration.")
          PY

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
