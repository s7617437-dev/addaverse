name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          rm -rf android
          flutter create --platforms=android --android-language kotlin .

      - name: Fix Android Kotlin Configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          app = Path("android/app/build.gradle.kts")
          root = Path("android/build.gradle.kts")

          # ------------------------------------------------
          # settings.gradle.kts
          # ------------------------------------------------
          if settings.exists():
              text = settings.read_text()

              text = re.sub(
                  r'id\("org\.jetbrains\.kotlin\.android"\)\s*version\s*"[^"]+"',
                  'id("org.jetbrains.kotlin.android") version "2.1.20"',
                  text
              )

              settings.write_text(text)

          # ------------------------------------------------
          # app/build.gradle.kts
          # ------------------------------------------------
          if app.exists():
              text = app.read_text()

              # Remove old kotlinOptions
              text = re.sub(
                  r'(?ms)^\s*kotlinOptions\s*\{.*?^\s*\}',
                  '',
                  text
              )

              # Remove old standalone compilerOptions
              text = re.sub(
                  r'(?ms)^\s*compilerOptions\s*\{.*?^\s*\}',
                  '',
                  text
              )

              # Remove previously added kotlin block
              text = re.sub(
                  r'(?ms)^\s*kotlin\s*\{\s*compilerOptions\s*\{.*?\}\s*\}',
                  '',
                  text
              )

              # Add correct Kotlin configuration
              text = text.rstrip() + '''

          kotlin {
              jvmToolchain(17)

              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          '''

              app.write_text(text)

          # ------------------------------------------------
          # root build.gradle.kts
          # ------------------------------------------------
          if root.exists():
              text = root.read_text()

              # Remove old Kotlin version declarations
              text = re.sub(
                  r'kotlin_version\s*=\s*"[^"]+"',
                  'kotlin_version = "2.1.20"',
                  text
              )

              root.write_text(text)

          print("Android Kotlin configuration fixed.")
          PY

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
