name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Recreate Android Project
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --android-language kotlin \
            --org com.avyra.app \
            .

      - name: Upgrade Kotlin Gradle Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle")

          if not p.exists():
              print("ERROR: android/settings.gradle not found")
              exit(1)

          s = p.read_text()

          old = re.search(
              r'id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'][^"\']+["\']',
              s
          )

          if old:
              print("Old Kotlin plugin:")
              print(old.group(0))

              s = re.sub(
                  r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
                  r'\g<1>2.1.20\g<2>',
                  s
              )

              p.write_text(s)

              print("Updated Kotlin plugin to 2.1.20")
          else:
              print("ERROR: Kotlin plugin entry not found")
              print(s)
              exit(1)
          PY

      - name: Show Android Configuration
        run: |
          echo "===== Kotlin Plugin ====="
          grep -n "org.jetbrains.kotlin.android" android/settings.gradle || true

          echo "===== Android Settings ====="
          cat android/settings.gradle

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
