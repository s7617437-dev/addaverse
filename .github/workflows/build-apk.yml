name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create \
            --platforms=android \
            --android-language kotlin \
            --org com.avyra.app \
            .

      - name: Update Kotlin Plugin
        run: |
          sed -i 's/version "2.1.0" apply false/version "2.3.20" apply false/' android/settings.gradle.kts

          echo "===== Kotlin Plugin ====="
          grep -n "org.jetbrains.kotlin.android" android/settings.gradle.kts

      - name: Fix JVM Target
        run: |
          sed -i '/kotlinOptions[[:space:]]*{/,/^[[:space:]]*}/d' android/app/build.gradle.kts

          cat >> android/app/build.gradle.kts <<'EOF'

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
EOF

          echo "===== JVM TARGET ====="
          tail -15 android/app/build.gradle.kts

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
