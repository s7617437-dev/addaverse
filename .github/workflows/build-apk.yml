name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          rm -rf android
          flutter create --platforms=android --android-language kotlin .

      - name: Fix Kotlin JVM Target
        run: |
          APP_GRADLE="android/app/build.gradle.kts"

          echo "Checking: $APP_GRADLE"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: build.gradle.kts not found"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          # Remove old kotlinOptions block
          text = re.sub(
              r'(?ms)^\s*kotlinOptions\s*\{.*?^\s*\}',
              '',
              text
          )

          # Remove an incorrectly inserted compilerOptions block
          text = re.sub(
              r'(?ms)^\s*compilerOptions\s*\{.*?^\s*\}',
              '',
              text
          )

          # Add the correct Kotlin compilerOptions block
          block = '''
          kotlin {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
                  )
              }
          }
          '''

          text = text.rstrip() + "\n\n" + block

          path.write_text(text)

          print("Kotlin JVM target fixed.")
          PY

          echo "===== FINAL build.gradle.kts ====="
          cat android/app/build.gradle.kts
          echo "==================================="

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
