name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Create Android project
        run: |
          rm -rf android
          flutter create --platforms=android --android-language kotlin .

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
