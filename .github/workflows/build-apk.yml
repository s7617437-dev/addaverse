name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Recreate Android Project
        run: |
          rm -rf android

          flutter create \
            --platforms=android \
            --android-language kotlin \
            --org com.avyra.app \
            .

      - name: Show Android Configuration
        run: |
          echo "===== SETTINGS FILE ====="

          if [ -f android/settings.gradle ]; then
            echo "FILE: android/settings.gradle"
            cat android/settings.gradle
          elif [ -f android/settings.gradle.kts ]; then
            echo "FILE: android/settings.gradle.kts"
            cat android/settings.gradle.kts
          else
            echo "ERROR: Android settings file not found"
            exit 1
          fi

          echo ""
          echo "===== KOTLIN PLUGIN ====="

          grep -Rni \
            "org.jetbrains.kotlin.android" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

          echo ""
          echo "===== GRADLE VERSIONS ====="

          grep -Rni \
            "com.android.application" \
            android \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Flutter Pub Get
        run: |
          flutter pub get

      - name: Flutter Clean
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
